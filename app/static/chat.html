<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快递 SOP 智能问答</title>
<!--
  单文件、零依赖、无 CDN —— 受限网络里也能打开。

  接入 POST /api/v1/chat/stream（SSE 真流式）。用 fetch + ReadableStream 手工解析
  SSE，而不是 EventSource：EventSource 只支持 GET，而问答要发 POST JSON。

  安全: 助手回答与引用来源都来自服务端，一律走 textContent / createElement，
  **绝不拼 innerHTML** —— 否则知识库里一篇标题带 <script> 的文档就能在访问者浏览器
  里执行脚本。密钥只存本标签页的 sessionStorage，关闭即消失。
-->
<style>
  :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#f6f8fa;
          --accent:#0969da; --danger:#cf222e; --ok:#1a7f37; --warn:#9a6700;
          --user:#ddf4ff; --bot:#fff; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         color:var(--fg); background:var(--bg); display:flex; flex-direction:column; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  header .spacer { flex:1; }
  .meta { font-size:12px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:20px 16px; }
  .wrap { max-width:820px; margin:0 auto; }
  .turn { display:flex; margin-bottom:16px; }
  .turn.user { justify-content:flex-end; }
  .bubble { max-width:86%; padding:10px 14px; border-radius:12px; border:1px solid var(--line);
            background:var(--bot); }
  .turn.user .bubble { background:var(--user); border-color:#b6e3ff; white-space:pre-wrap;
                       word-break:break-word; }
  .answer { white-space:pre-wrap; word-break:break-word; }
  .answer.pending { color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px;
         font-size:12px; color:var(--muted); }
  .row:empty { display:none; }
  .badge { border:1px solid var(--line); border-radius:999px; padding:0 8px; font-size:11px; }
  .badge.rag_qa { color:var(--accent); border-color:#b6e3ff; background:#ddf4ff; }
  .badge.multi_hop { color:var(--ok); border-color:#aceebb; background:#dafbe1; }
  .badge.degraded { color:var(--warn); border-color:#f5d9a0; background:#fff8c5; }
  .badge.error { color:var(--danger); border-color:#ffcecb; background:#ffebe9; }
  .err { color:var(--danger); white-space:pre-wrap; }
  details { margin-top:8px; font-size:13px; }
  summary { cursor:pointer; color:var(--muted); }
  .src { border-left:2px solid var(--line); padding:4px 0 4px 10px; margin:8px 0; }
  .src .head { font-size:12px; color:var(--muted); }
  .src .txt { white-space:pre-wrap; word-break:break-word; margin-top:4px; }
  details.mem { margin-top:8px; font-size:12px; }
  details.mem summary { color:#7c3aed; }
  .mem-item { border-left:2px solid #ddd6fe; background:#faf5ff; border-radius:4px;
              padding:6px 8px; margin:6px 0 0; }
  .mem-item .head { font-size:12px; color:#6d28d9; }
  .mem-item .txt { white-space:pre-wrap; word-break:break-word; margin-top:2px; }
  footer { background:#fff; border-top:1px solid var(--line); padding:12px 16px; }
  .composer { max-width:820px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; min-height:46px; max-height:160px; padding:10px 12px;
             border:1px solid var(--line); border-radius:10px; font:inherit; }
  button { padding:10px 16px; border:1px solid var(--line); border-radius:10px;
           background:#fff; font:inherit; cursor:pointer; white-space:nowrap; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=password] { padding:6px 8px; border:1px solid var(--line); border-radius:8px;
                         font:inherit; font-size:13px; width:210px; }
  .chips { max-width:820px; margin:0 auto 8px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px;
          padding:4px 12px; font-size:13px; cursor:pointer; color:var(--muted); }
  .chip:hover { color:var(--accent); border-color:#b6e3ff; }
</style>
</head>
<body>

<header>
  <h1>快递 SOP 智能问答</h1>
  <span class="meta" id="session-label"></span>
  <span class="spacer"></span>
  <label class="meta" for="key">访问密钥</label>
  <input id="key" type="password" placeholder="服务端配了访问控制时必填" autocomplete="off">
  <label class="meta" for="uid" title="仅本地开发生效；服务端启用访问控制后此请求头会被忽略">用户</label>
  <input id="uid" class="uid" placeholder="仅本地开发" autocomplete="off">
  <button id="save-key">保存</button>
  <button id="new-session">新会话</button>
  <a class="meta" href="/memory">我的记忆</a>
  <a class="meta" href="/admin">管理台</a>
  <a class="meta" href="/docs">接口文档</a>
</header>

<div id="log"><div class="wrap" id="msgs"></div></div>

<footer>
  <div class="chips" id="chips"></div>
  <div class="composer">
    <textarea id="q" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="primary" id="send">发送</button>
    <button id="stop" disabled>停止</button>
  </div>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KEY_STORE = "sop_qa_api_key";
const SID_STORE = "sop_qa_session_id";

const EXAMPLES = [
  "包裹破损了怎么申请理赔？",
  "没保价的包裹丢了赔多少？",
  "网点暴力分拣会被罚多少钱？",
  "经营快递业务需要什么许可？",
];

// ── 会话与密钥 ───────────────────────────────────────────
function userId() { return sessionStorage.getItem("sop_qa_user_id") || ""; }
function apiKey() { return sessionStorage.getItem(KEY_STORE) || ""; }
function sessionId() {
  let sid = sessionStorage.getItem(SID_STORE);
  if (!sid) {                    // 接口要求 ≥16 位且不可猜测 → UUID4 去掉横线
    sid = (crypto.randomUUID ? crypto.randomUUID()
         : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/-/g, "");
    sessionStorage.setItem(SID_STORE, sid);
  }
  return sid;
}
function label() {
  const sid = sessionStorage.getItem(SID_STORE);
  $("session-label").textContent = sid ? "会话 " + sid.slice(0, 8) : "新会话";
}
function newSession() {
  sessionStorage.removeItem(SID_STORE);
  $("msgs").replaceChildren();
  label();
}

// ── DOM 构建 (一律 createElement / textContent, 不拼 HTML) ─
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scroll() { $("log").scrollTop = $("log").scrollHeight; }

// 气泡内部结构固定: [徽标行][回答正文][引用]. 正文单独一个节点,
// 这样流式更新正文时不会把徽标和引用冲掉 (踩过: 直接 bubble.textContent = ...
// 会把已渲染的徽标行整块删掉).
function addTurn(who) {
  const turn = el("div", "turn " + who);
  const bubble = el("div", "bubble");
  const row = el("div", "row");
  const body = el("div", "answer");
  bubble.append(row, body);
  turn.append(bubble);
  $("msgs").append(turn);
  scroll();
  return { bubble, row, body };
}
function renderMemories(bubble, memories) {
  if (!memories || !memories.length) return;
  const box = el("details", "mem");
  box.append(el("summary", null, "系统记得你 " + memories.length + " 条"));
  for (const m of memories) {
    const item = el("div", "mem-item");
    const kind = { fact: "事实", preference: "偏好", episode: "经历" }[m.kind] || m.kind;
    item.append(el("div", "head",
      kind + (m.key ? " · " + m.key : "") + "　重要度 " + (m.importance ?? "-")));
    item.append(el("div", "txt", m.text || ""));
    box.append(item);
  }
  bubble.append(box);
}
function renderSources(bubble, sources, rounds) {
  if (!sources || !sources.length) return;
  const box = el("details");
  box.append(el("summary", null,
    "引用 " + sources.length + " 段" + (rounds ? "（多轮检索 " + rounds + " 轮）" : "")));
  for (const s of sources) {
    const item = el("div", "src");
    const idx = s.chunk_index;
    const where = (s.title || s.doc_id || "未知文档")
      + (idx === null || idx === undefined ? "" : " · 第 " + (idx + 1) + " 段")
      + (s.tags ? " · " + s.tags : "");
    item.append(el("div", "head", where + "　相似度 " + (s.similarity ?? "-")));
    item.append(el("div", "txt", s.content || ""));
    box.append(item);
  }
  bubble.append(box);
  scroll();
}

// ── SSE: fetch + ReadableStream 手工解析 ─────────────────
async function ask(question, ui, signal) {
  const headers = { "Content-Type": "application/json" };
  if (apiKey()) headers["X-API-Key"] = apiKey();
  // 断言式身份: 只在服务端未启用访问控制时被采纳 (启用后由认证决定, 会被忽略)
  if (userId()) headers["X-User-Id"] = userId();

  const res = await fetch("/api/v1/chat/stream", {
    method: "POST",
    headers,
    body: JSON.stringify({ question, session_id: sessionId() }),
    signal,
  });

  // 401/429 走统一错误体 (JSON), 不是 SSE —— 必须先判断再读流
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    const d = body && (body.detail || (body.error && body.error.message));
    throw new Error(typeof d === "string" && d ? d
      : res.status === 401 ? "认证失败（401）：请检查访问密钥"
      : res.status === 429 ? "被限流（429）：请稍后再试"
      : "请求失败 HTTP " + res.status);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let answer = "";
  let streaming = false;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let idx;
    while ((idx = buffer.indexOf("\n\n")) >= 0) {
      const frame = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      const line = frame.split("\n").find((l) => l.startsWith("data: "));
      if (!line) continue;
      const payload = line.slice(6).trim();
      if (payload === "[DONE]") return answer;

      let ev;
      try { ev = JSON.parse(payload); } catch { continue; }

      if (ev.type === "intent") {
        ui.row.append(el("span", "badge " + ev.intent, ev.intent));
      } else if (ev.type === "answer_delta") {
        if (!streaming) {
          ui.body.textContent = "";
          ui.body.classList.remove("pending");
          streaming = true;
        }
        answer += ev.delta;
        ui.body.textContent = answer;     // 只改正文节点, 徽标/引用不受影响
        ui.bubble.classList.add("cursor");
        scroll();
      } else if (ev.type === "memory") {
        // 记忆事件在生成之前就到, 直接挂在气泡上, 不依赖后面的答案
        renderMemories(ui.bubble, ev.memories);
      } else if (ev.type === "sources") {
        renderSources(ui.bubble, ev.sources, ev.rounds);
      } else if (ev.type === "error") {
        ui.body.append(el("div", "err", "出错了：" + ev.error));
        ui.row.append(el("span", "badge error", "error"));
      } else if (ev.type === "done") {
        if (ev.trace_id) ui.row.append(el("span", null, "trace " + ev.trace_id.slice(0, 12)));
        return answer;
      }
    }
  }
  return answer;
}

// ── 发送 ────────────────────────────────────────────────
let busy = false;
let inflight = null;

async function send() {
  const q = $("q").value.trim();
  if (!q || busy) return;
  $("q").value = "";
  $("q").style.height = "auto";
  $("chips").replaceChildren();          // 示例只在首屏有意义

  addTurn("user").body.textContent = q;
  const ui = addTurn("assistant");
  ui.body.classList.add("pending");
  ui.body.textContent = "思考中…";

  busy = true;
  $("send").disabled = true;
  $("stop").disabled = false;
  inflight = new AbortController();
  const t0 = performance.now();

  try {
    await ask(q, ui, inflight.signal);
  } catch (e) {
    ui.body.classList.remove("pending");
    if (e.name === "AbortError") {
      ui.row.append(el("span", "badge degraded", "已停止"));
      if (!ui.body.textContent || ui.body.textContent === "思考中…") {
        ui.body.textContent = "（已停止，服务端不会把半截回答写进会话历史）";
      }
    } else {
      ui.body.textContent = "";
      ui.body.append(el("div", "err", String(e.message || e)));
    }
  } finally {
    busy = false;
    inflight = null;
    $("send").disabled = false;
    $("stop").disabled = true;
    ui.bubble.classList.remove("cursor");
    ui.body.classList.remove("pending");
    ui.row.append(el("span", null, ((performance.now() - t0) / 1000).toFixed(1) + " 秒"));
    scroll();
  }
}

// ── 事件绑定 ────────────────────────────────────────────
$("send").onclick = send;
$("stop").onclick = () => { if (inflight) inflight.abort(); };
$("new-session").onclick = newSession;
$("save-key").onclick = () => {
  const v = $("key").value.trim();
  if (v) sessionStorage.setItem(KEY_STORE, v); else sessionStorage.removeItem(KEY_STORE);
  const u = $("uid").value.trim();
  if (u) sessionStorage.setItem("sop_qa_user_id", u);
  else sessionStorage.removeItem("sop_qa_user_id");
  $("save-key").textContent = "已保存";
  setTimeout(() => { $("save-key").textContent = "保存"; }, 1500);
};
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("q").addEventListener("input", () => {
  $("q").style.height = "auto";
  $("q").style.height = Math.min($("q").scrollHeight, 160) + "px";
});

for (const q of EXAMPLES) {
  const c = el("button", "chip", q);
  c.onclick = () => { $("q").value = q; send(); };
  $("chips").append(c);
}
$("key").value = apiKey();
$("uid").value = userId();
label();

// ?q=问题 —— 深链: 问题可以直接分享, README 里也能链过来 (顺带让截图能跑真实问答)
const preset = new URLSearchParams(location.search).get("q");
if (preset) { $("q").value = preset; send(); }
</script>
</body>
</html>
